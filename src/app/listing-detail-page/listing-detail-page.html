@if (!isLoading()) {
<div class="content-box">
    <p>This listing has been viewd {{listing()?.views}} times.</p>
    <a routerLink="/listings">
        <button>Back</button>
    </a>
    <h2>{{listing()?.name}}</h2>
    <p>{{listing()?.description}}</p>
    <p>${{listing()?.price}}</p>
    <a routerLink="/contact/{{listing()?.id}}">
        <button>Contact Seller</button>
    </a>
</div>
}
@else {
    <div class="content-box">
        <h3>Loading...</h3>
    </div>
}
